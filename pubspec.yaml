name: truth_or_dare
description: Truth or Dare party game (18+) with 4 languages (English, French, Kinyarwanda, Spanish), 5 categories (including Couple Mode), and endless players.
publish_to: 'none'
version: 1.1.2+4

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_launcher_icons: ^0.13.1
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/data/locales/
    - assets/images/
    - assets/music/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
